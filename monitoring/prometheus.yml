global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'rag-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['rag-knowledge-base:8000']
        labels:
          service: 'it-ops-rag'
          env: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
